<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__TITLE__</title>

    <!-- AntV G6 CDN -->
    <script src="https://unpkg.com/@antv/g6@4.8.24/dist/g6.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/dependency-analysis.css">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>正在加载分析数据...</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">__TITLE__</h1>
                <div class="header-actions">
                    <button id="export-btn" class="btn btn-secondary">
                        <i class="fas fa-download"></i> 导出报告
                    </button>
                    <button id="refresh-btn" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> 刷新数据
                    </button>
                </div>
            </div>
            <div class="report-info">
                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <span>生成时间: __GENERATION_TIME__</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-file-code"></i>
                    <span>分析项目: <span id="project-name"></span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-folder-open"></i>
                    <span>项目路径: <span id="project-path"></span></span>
                </div>
            </div>
        </header>

        <!-- Metadata Section -->
        <section class="metadata-section">
            <h2><i class="fas fa-info-circle"></i> 分析概览</h2>
            <div class="metadata-content">
                <pre id="metadata-text">__METADATA__</pre>
            </div>
        </section>

        <!-- Statistics Cards -->
        <section class="stats-section">
            <h2><i class="fas fa-chart-bar"></i> 统计概览</h2>
            <div class="stats-grid" id="stats-grid">
                <!-- 动态生成统计卡片 -->
            </div>
        </section>

        <!-- Visualization Tabs -->
        <section class="visualization-section">
            <div class="tab-header">
                <h2><i class="fas fa-project-diagram"></i> 依赖可视化</h2>
                <div class="tab-controls">
                    <button class="tab-btn active" data-tab="package-view">
                        <i class="fas fa-folder"></i> 包级视图
                    </button>
                    <button class="tab-btn" data-tab="class-view">
                        <i class="fas fa-cube"></i> 类级视图
                    </button>
                    <button class="tab-btn" data-tab="method-view">
                        <i class="fas fa-code"></i> 方法视图
                    </button>

                </div>
                <div class="view-controls">
                    <!-- 固定使用力导向布局，移除布局选择器 -->
                    <button id="zoom-in-btn" class="btn btn-icon" title="放大">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button id="zoom-out-btn" class="btn btn-icon" title="缩小">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <button id="fit-view-btn" class="btn btn-icon" title="适应视图">
                        <i class="fas fa-compress"></i>
                    </button>
                </div>
            </div>

            <div class="tab-content">
                <!-- Package View -->
                <div class="tab-pane active" id="package-view">
                    <div class="graph-container">
                        <div id="package-graph" class="graph-canvas"></div>
                    </div>
                </div>

                <!-- Class View -->
                <div class="tab-pane" id="class-view">
                    <div class="graph-container">
                        <div id="class-graph" class="graph-canvas"></div>
                        <div class="graph-sidebar">
                            <div class="sidebar-section">
                                <h4>类详情</h4>
                                <div id="class-details" class="node-details">
                                    <p class="placeholder">点击类节点查看详情</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Method View - 统一方法视图 -->
                <div class="tab-pane" id="method-view">
                    <!-- 统一的控制面板 -->
                    <div class="method-analysis-controls">
                        <div class="control-group">
                            <!-- 入口方法选择 -->
                            <label class="control-label">入口方法:</label>
                            <select id="entry-method-select" class="control-select">
                                <option value="">选择入口方法（可选）</option>
                                <!-- 动态填充业务入口方法 -->
                            </select>

                            <!-- 模糊搜索 -->
                            <label class="control-label">模糊搜索:</label>
                            <div class="search-controls">
                                <input type="text" id="method-search-input" class="search-input" placeholder="输入方法名进行搜索...">
                                <div id="search-results" class="search-results-dropdown" style="display: none;">
                                    <!-- 动态生成搜索结果 -->
                                </div>
                            </div>
                        </div>

                        <div class="control-group">
                            <!-- 筛选条件 -->
                            <label class="control-label">筛选条件:</label>

                            <!-- 复杂度筛选 -->
                            <select id="complexity-filter" class="control-select">
                                <option value="all">所有复杂度</option>
                                <option value="high">高复杂度 (>30)</option>
                                <option value="medium">中等复杂度 (15-30)</option>
                                <option value="low">低复杂度 (≤15)</option>
                            </select>

                            <!-- 调用次数筛选 -->
                            <select id="call-count-filter" class="control-select">
                                <option value="all">所有调用次数</option>
                                <option value="zero">调用次数 = 0</option>
                                <option value="positive">调用次数 > 0</option>
                                <option value="ge5">调用次数 ≥ 5</option>
                                <option value="ge10">调用次数 ≥ 10</option>
                                <option value="ge20">调用次数 ≥ 20</option>
                            </select>

                            <!-- 功能按钮 -->
                            <button id="reset-view" class="btn btn-outline">重置视图</button>
                            <button id="export-graph" class="btn btn-outline">导出图片</button>
                            <button id="clear-search" class="btn btn-outline">清空搜索</button>
                        </div>
                    </div>

                    <!-- 统计信息区域 -->
                    <div class="graph-stats">
                        <div class="stat-item">
                            <span class="stat-label">方法节点:</span>
                            <span id="node-count" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">调用关系:</span>
                            <span id="edge-count" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">复杂方法:</span>
                            <span id="complex-methods-count" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">平均复杂度:</span>
                            <span id="avg-complexity" class="stat-value">0</span>
                        </div>
                        <div class="stat-item" id="selected-entry-stat" style="display: none;">
                            <span class="stat-label">当前入口:</span>
                            <span id="selected-entry-name" class="stat-value">无</span>
                        </div>
                    </div>

                    <!-- 方法来源图例 -->
                    <div class="method-source-legend" id="method-source-legend" style="display: none;">
                        <h5><i class="fas fa-info-circle"></i> 方法来源说明</h5>
                        <div class="legend-content" id="legend-content">
                            <!-- JavaScript 动态生成图例内容 -->
                        </div>
                    </div>

                    <!-- 统一的方法视图容器 -->
                    <div id="method-view-container" class="method-unified-view">
                        <div id="method-graph" class="graph-canvas"></div>
                    </div>

                    <!-- 方法详情面板 -->
                    <div id="method-details-panel" class="method-details-panel">
                        <div class="panel-header">
                            <h4>方法详情</h4>
                            <button id="close-details" class="close-btn">×</button>
                        </div>
                        <div class="panel-content">
                            <div id="method-info" class="method-info"></div>
                            <div id="method-calls" class="method-calls">
                                <h5>调用关系</h5>
                                <div id="calls-list"></div>
                            </div>
                            <div id="method-called-by" class="method-called-by">
                                <h5>被调用关系</h5>
                                <div id="called-by-list"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Code Smells Section -->
        <section class="issues-section">
            <h2><i class="fas fa-exclamation-triangle"></i> 代码问题分析</h2>
            <div class="issues-tabs">
                <button class="issues-tab-btn active" data-issues="critical">
                    <i class="fas fa-fire"></i> 严重问题
                </button>
                <button class="issues-tab-btn" data-issues="high">
                    <i class="fas fa-exclamation-circle"></i> 高优先级
                </button>
                <button class="issues-tab-btn" data-issues="medium">
                    <i class="fas fa-info-circle"></i> 中等优先级
                </button>
                <button class="issues-tab-btn" data-issues="all">
                    <i class="fas fa-list"></i> 全部问题
                </button>
            </div>
            <div class="issues-content" id="issues-content">
                <!-- 动态生成问题列表 -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>由 Nekoama 代码分析工具生成</p>
                <div class="footer-actions">
                    <button id="print-btn" class="btn btn-text">
                        <i class="fas fa-print"></i> 打印报告
                    </button>
                    <button id="fullscreen-btn" class="btn btn-text">
                        <i class="fas fa-expand"></i> 全屏查看
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Hidden Data Container -->
    <script type="application/json" id="analysis-data">
        __DATA_PLACEHOLDER__
    </script>

    <!-- Custom JavaScript -->
    <script>
        /**
         * 标签页切换功能
         * 解决标签页内容不显示的问题
         */
        function switchTab(targetTabId) {
            try {
                // 移除所有标签页按钮的active类
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });

                // 移除所有内容面板的active类
                document.querySelectorAll('.tab-pane').forEach(pane => {
                    pane.classList.remove('active');
                });

                // 为目标标签页按钮添加active类
                const targetBtn = document.querySelector(`[data-tab="${targetTabId}"]`);
                if (targetBtn) {
                    targetBtn.classList.add('active');
                } else {
                    console.warn(`未找到标签页按钮: ${targetTabId}`);
                }

                // 为目标内容面板添加active类
                const targetPane = document.getElementById(targetTabId);
                if (targetPane) {
                    targetPane.classList.add('active');
                } else {
                    console.warn(`未找到标签页内容: ${targetTabId}`);
                }

                console.log(`切换到标签页: ${targetTabId}`);
            } catch (error) {
                console.error('标签页切换失败:', error);
            }
        }

        // 初始化标签页切换功能
        function initializeTabSwitching() {
            try {
                // 为所有标签页按钮绑定点击事件
                document.querySelectorAll('.tab-btn').forEach(button => {
                    button.addEventListener('click', function(event) {
                        event.preventDefault();
                        const targetTabId = this.getAttribute('data-tab');
                        switchTab(targetTabId);
                    });
                });

                console.log('标签页切换功能已初始化');

                // 确保默认标签页（包级视图）处于激活状态
                const defaultTab = document.querySelector('.tab-btn[data-tab="package-view"]');
                if (defaultTab && !defaultTab.classList.contains('active')) {
                    switchTab('package-view');
                }

            } catch (error) {
                console.error('标签页功能初始化失败:', error);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 延迟初始化确保DOM完全加载
            setTimeout(initializeTabSwitching, 100);
        });

        // 备用初始化（如果DOMContentLoaded已经触发）
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeTabSwitching);
        } else {
            setTimeout(initializeTabSwitching, 100);
        }

        /**
         * 统计概览功能
         */
        function initializeStatistics() {
            try {
                const statsGrid = document.getElementById('stats-grid');
                if (!statsGrid) {
                    console.warn('未找到统计网格容器');
                    return;
                }

                // 尝试从数据中获取统计信息
                const dataElement = document.getElementById('analysis-data');
                if (!dataElement) {
                    console.warn('未找到分析数据');
                    return;
                }

                const data = JSON.parse(dataElement.textContent);
                const projectInfo = data.projectInfo || {};
                const methodCallGraph = data.methodCallGraph || { nodes: [], edges: [] };
                const classGraph = data.classGraph || { nodes: [], edges: [] };

                // 生成统计卡片
                const stats = [
                    {
                        icon: 'fa-folder',
                        title: '包数量',
                        value: projectInfo.packageCount || calculatePackageCount(classGraph.nodes),
                        color: '#1890ff'
                    },
                    {
                        icon: 'fa-cube',
                        title: '类数量',
                        value: classGraph.nodes.length,
                        color: '#52c41a'
                    },
                    {
                        icon: 'fa-code',
                        title: '方法数量',
                        value: methodCallGraph.nodes.length,
                        color: '#fa8c16'
                    },
                    {
                        icon: 'fa-link',
                        title: '依赖关系',
                        value: methodCallGraph.edges.length + classGraph.edges.length,
                        color: '#722ed1'
                    },
                    {
                        icon: 'fa-exclamation-triangle',
                        title: '复杂方法',
                        value: methodCallGraph.nodes.filter(n => (n.complexity || 0) > 30).length,
                        color: '#ff4d4f'
                    },
                    {
                        icon: 'fa-chart-line',
                        title: '平均复杂度',
                        value: calculateAverageComplexity(methodCallGraph.nodes).toFixed(1),
                        color: '#13c2c2'
                    }
                ];

                statsGrid.innerHTML = stats.map(stat => `
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: ${stat.color}20; color: ${stat.color};">
                            <i class="fas ${stat.icon}"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-title">${stat.title}</div>
                            <div class="stat-value">${stat.value}</div>
                        </div>
                    </div>
                `).join('');

                console.log('统计概览已生成');
            } catch (error) {
                console.error('统计概览初始化失败:', error);
            }
        }

        function calculatePackageCount(nodes) {
            const packages = new Set();
            nodes.forEach(node => {
                if (node.packageName) {
                    packages.add(node.packageName);
                }
            });
            return packages.size;
        }

        function calculateAverageComplexity(nodes) {
            if (nodes.length === 0) return 0;
            const totalComplexity = nodes.reduce((sum, node) => sum + (node.complexity || 0), 0);
            return totalComplexity / nodes.length;
        }

        /**
         * 代码问题分析功能
         */
        function initializeIssuesAnalysis() {
            try {
                const issuesContent = document.getElementById('issues-content');
                if (!issuesContent) {
                    console.warn('未找到问题内容容器');
                    return;
                }

                // 为问题标签页添加点击事件
                document.querySelectorAll('.issues-tab-btn').forEach(button => {
                    button.addEventListener('click', function(event) {
                        event.preventDefault();
                        const issuesType = this.getAttribute('data-issues');
                        switchIssuesTab(issuesType);
                    });
                });

                // 初始化问题显示
                switchIssuesTab('critical');
                console.log('代码问题分析功能已初始化');
            } catch (error) {
                console.error('代码问题分析初始化失败:', error);
            }
        }

        function switchIssuesTab(issuesType) {
            try {
                // 移除所有active类
                document.querySelectorAll('.issues-tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });

                // 添加当前active类
                const activeBtn = document.querySelector(`[data-issues="${issuesType}"]`);
                if (activeBtn) {
                    activeBtn.classList.add('active');
                }

                // 生成问题列表
                generateIssuesList(issuesType);
                console.log(`切换到问题类型: ${issuesType}`);
            } catch (error) {
                console.error('问题类型切换失败:', error);
            }
        }

        function generateIssuesList(issuesType) {
            try {
                const issuesContent = document.getElementById('issues-content');
                if (!issuesContent) return;

                // 模拟问题数据（实际应该从后端获取）
                const mockIssues = generateMockIssues(issuesType);

                if (mockIssues.length === 0) {
                    issuesContent.innerHTML = `
                        <div class="empty-issues">
                            <i class="fas fa-check-circle" style="font-size: 48px; color: #52c41a; margin-bottom: 16px;"></i>
                            <p>没有发现${getIssuesTypeDescription(issuesType)}的问题</p>
                        </div>
                    `;
                    return;
                }

                issuesContent.innerHTML = mockIssues.map(issue => `
                    <div class="issue-item severity-${issue.severity}">
                        <div class="issue-header">
                            <span class="issue-type">${issue.type}</span>
                            <span class="issue-severity">${issue.severity.toUpperCase()}</span>
                        </div>
                        <div class="issue-message">${issue.message}</div>
                        <div class="issue-location">
                            <i class="fas fa-file-code"></i>
                            <span>${issue.file}:${issue.line}</span>
                        </div>
                        <div class="issue-description">${issue.description}</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('生成问题列表失败:', error);
            }
        }

        function generateMockIssues(issuesType) {
            const allIssues = [
                {
                    type: 'Long Method',
                    severity: 'high',
                    message: '方法过长，建议拆分',
                    file: 'ExampleService.java',
                    line: 125,
                    description: '方法calculateComplexLogic超过50行，建议拆分为多个小方法以提高可读性'
                },
                {
                    type: 'Duplicate Code',
                    severity: 'medium',
                    message: '发现重复代码',
                    file: 'UserController.java',
                    line: 67,
                    description: 'validateEmail方法与UserValidator中的方法重复'
                },
                {
                    type: 'Magic Number',
                    severity: 'low',
                    message: '使用魔法数字',
                    file: 'ConfigManager.java',
                    line: 34,
                    description: '硬编码数值100，应该定义为常量'
                },
                {
                    type: 'Complex Condition',
                    severity: 'critical',
                    message: '条件过于复杂',
                    file: 'BusinessLogicHandler.java',
                    line: 89,
                    description: 'if条件嵌套过深，建议使用策略模式重构'
                }
            ];

            switch (issuesType) {
                case 'critical':
                    return allIssues.filter(i => i.severity === 'critical');
                case 'high':
                    return allIssues.filter(i => i.severity === 'high');
                case 'medium':
                    return allIssues.filter(i => i.severity === 'medium');
                case 'all':
                    return allIssues;
                default:
                    return [];
            }
        }

        function getIssuesTypeDescription(issuesType) {
            const descriptions = {
                'critical': '严重',
                'high': '高优先级',
                'medium': '中等优先级',
                'all': ''
            };
            return descriptions[issuesType] || '';
        }

        // 初始化所有功能
        function initializeAllFeatures() {
            initializeStatistics();
            initializeIssuesAnalysis();
        }

        // 扩展页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 延迟初始化确保DOM完全加载
            setTimeout(() => {
                initializeTabSwitching();
                initializeAllFeatures();
            }, 200);
        });

        // 备用初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(() => {
                    initializeTabSwitching();
                    initializeAllFeatures();
                }, 200);
            });
        } else {
            setTimeout(() => {
                initializeTabSwitching();
                initializeAllFeatures();
            }, 200);
        }
    </script>
    <script src="static/js/g6-visualizer.js"></script>
</body>
</html>
