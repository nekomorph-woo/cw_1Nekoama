<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__TITLE__</title>

    <!-- AntV G6 CDN -->
    <script src="https://unpkg.com/@antv/g6@4.8.24/dist/g6.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/dependency-analysis.css">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>正在加载分析数据...</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">__TITLE__</h1>
                <div class="header-actions">
                    <button id="export-btn" class="btn btn-secondary">
                        <i class="fas fa-download"></i> 导出报告
                    </button>
                    <button id="refresh-btn" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> 刷新数据
                    </button>
                </div>
            </div>
            <div class="report-info">
                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <span>生成时间: __GENERATION_TIME__</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-file-code"></i>
                    <span>分析项目: <span id="project-name"></span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-folder-open"></i>
                    <span>项目路径: <span id="project-path"></span></span>
                </div>
            </div>
        </header>

        <!-- Metadata Section -->
        <section class="metadata-section">
            <h2><i class="fas fa-info-circle"></i> 分析概览</h2>
            <div class="metadata-content">
                <pre id="metadata-text">__METADATA__</pre>
            </div>
        </section>

        <!-- Statistics Cards -->
        <section class="stats-section">
            <h2><i class="fas fa-chart-bar"></i> 统计概览</h2>
            <div class="stats-grid" id="stats-grid">
                <!-- 动态生成统计卡片 -->
            </div>
        </section>

        <!-- Visualization Tabs -->
        <section class="visualization-section">
            <div class="tab-header">
                <h2><i class="fas fa-project-diagram"></i> 依赖可视化</h2>
                <div class="tab-controls">
                    <button class="tab-btn active" data-tab="package-view">
                        <i class="fas fa-folder"></i> 包级视图
                    </button>
                    <button class="tab-btn" data-tab="class-view">
                        <i class="fas fa-cube"></i> 类级视图
                    </button>
                    <button class="tab-btn" data-tab="method-view">
                        <i class="fas fa-code"></i> 方法热力图
                    </button>
                    <!-- 场景分析标签页已移除 -->
                </div>
                <div class="view-controls">
                    <!-- 固定使用力导向布局，移除布局选择器 -->
                    <button id="zoom-in-btn" class="btn btn-icon" title="放大">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button id="zoom-out-btn" class="btn btn-icon" title="缩小">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <button id="fit-view-btn" class="btn btn-icon" title="适应视图">
                        <i class="fas fa-compress"></i>
                    </button>
                </div>
            </div>

            <div class="tab-content">
                <!-- Package View -->
                <div class="tab-pane active" id="package-view">
                    <div class="graph-container">
                        <div id="package-graph" class="graph-canvas"></div>
                        <div class="graph-sidebar">
                            <div class="sidebar-section">
                                <h4>节点筛选</h4>
                                <div class="filter-controls">
                                    <label>
                                        <input type="checkbox" id="filter-high-complexity" checked>
                                        高复杂度节点
                                    </label>
                                    <label>
                                        <input type="checkbox" id="filter-cycles" checked>
                                        循环依赖
                                    </label>
                                    <label>
                                        <input type="number" id="min-dependencies" min="1" value="3" placeholder="最小依赖数">
                                    </label>
                                </div>
                            </div>
                            <div class="sidebar-section">
                                <h4>节点详情</h4>
                                <div id="package-details" class="node-details">
                                    <p class="placeholder">点击节点查看详情</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Class View -->
                <div class="tab-pane" id="class-view">
                    <div class="graph-container">
                        <div id="class-graph" class="graph-canvas"></div>
                        <div class="graph-sidebar">
                            <div class="sidebar-section">
                                <h4>类类型筛选</h4>
                                <div class="filter-controls">
                                    <label>
                                        <input type="checkbox" id="filter-controllers" checked>
                                        控制器类
                                    </label>
                                    <label>
                                        <input type="checkbox" id="filter-services" checked>
                                        服务类
                                    </label>
                                    <label>
                                        <input type="checkbox" id="filter-pojos" checked>
                                        POJO类
                                    </label>
                                    <label>
                                        <input type="checkbox" id="filter-interfaces" checked>
                                        接口
                                    </label>
                                </div>
                            </div>
                            <div class="sidebar-section">
                                <h4>类详情</h4>
                                <div id="class-details" class="node-details">
                                    <p class="placeholder">点击类节点查看详情</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Method View - 重构后的调用关系图和调用链分析 -->
                <div class="tab-pane" id="method-view">
                    <!-- 模式切换控件 -->
                    <div class="method-analysis-controls">
                        <div class="control-group">
                            <label class="control-label">分析模式:</label>
                            <button id="callgraph-mode" class="btn btn-primary active">调用关系图</button>
                            <button id="callchain-mode" class="btn btn-secondary">调用链分析</button>
                        </div>

                        <!-- 调用关系图模式的控件 -->
                        <div id="callgraph-controls" class="control-group callgraph-mode-controls">
                            <label class="control-label">筛选条件:</label>

                            <!-- 复杂度筛选 -->
                            <select id="complexity-filter" class="control-select">
                                <option value="all">所有复杂度</option>
                                <option value="high">高复杂度 (>30)</option>
                                <option value="medium">中等复杂度 (15-30)</option>
                                <option value="low">低复杂度 (≤15)</option>
                            </select>

                            <!-- 调用次数筛选 (fanIn统计) -->
                            <select id="call-count-filter" class="control-select">
                                <option value="0">调用次数 = 0</option>
                                <option value="1" selected>调用次数 > 0</option>
                                <option value="5">调用次数 ≥ 5</option>
                                <option value="10">调用次数 ≥ 10</option>
                                <option value="20">调用次数 ≥ 20</option>
                            </select>

                            <!-- 功能按钮 -->
                            <button id="reset-view" class="btn btn-outline">重置视图</button>
                            <button id="export-graph" class="btn btn-outline">导出图片</button>
                        </div>

                        <!-- 调用链分析模式的控件 -->
                        <div id="callchain-controls" class="control-group callchain-mode-controls" style="display: none;">
                            <!-- 入口方法下拉框 -->
                            <label class="control-label">入口方法:</label>
                            <select id="entry-method-select" class="control-select">
                                <option value="">选择入口方法</option>
                                <!-- 动态填充业务入口方法 -->
                            </select>

                            <!-- 搜索下拉框 -->
                            <label class="control-label">模糊搜索:</label>
                            <div class="search-controls">
                                <input type="text" id="method-search-input" class="search-input" placeholder="输入方法名进行搜索...">
                                <div id="search-results" class="search-results-dropdown" style="display: none;">
                                    <!-- 动态生成搜索结果 -->
                                </div>
                            </div>

                            <!-- 功能按钮 -->
                            <button id="analyze-callchain" class="btn btn-primary">分析调用链</button>
                            <button id="clear-search" class="btn btn-outline">清空搜索</button>
                        </div>
                    </div>

                    <!-- 统计信息区域 -->
                    <div class="graph-stats">
                        <div class="stat-item">
                            <span class="stat-label">方法节点:</span>
                            <span id="node-count" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">调用关系:</span>
                            <span id="edge-count" class="stat-value">0</span>
                        </div>
                        <div class="stat-item callchain-mode-controls" style="display: none;">
                            <span class="stat-label">链长度:</span>
                            <span id="chain-length" class="stat-value">0</span>
                        </div>
                        <div class="stat-item callchain-mode-controls" style="display: none;">
                            <span class="stat-label">复杂度总和:</span>
                            <span id="chain-complexity" class="stat-value">0</span>
                        </div>
                        <div class="stat-item callgraph-mode-controls">
                            <span class="stat-label">复杂方法:</span>
                            <span id="complex-methods-count" class="stat-value">0</span>
                        </div>
                    </div>

                    <!-- 调用关系图容器 -->
                    <div id="callgraph-container" class="method-callgraph">
                        <div id="method-call-graph" class="graph-canvas"></div>
                    </div>

                    <!-- 调用链分析容器 -->
                    <div id="callchain-container" class="method-callchain" style="display: none;">
                        <div id="call-chain-graph" class="graph-canvas"></div>
                        <div id="chain-details" class="chain-details">
                            <h5>调用链详情</h5>
                            <div id="chain-steps" class="chain-steps"></div>
                        </div>
                    </div>

                    <!-- 方法详情面板 -->
                    <div id="method-details-panel" class="method-details-panel">
                        <div class="panel-header">
                            <h4>方法详情</h4>
                            <button id="close-details" class="close-btn">×</button>
                        </div>
                        <div class="panel-content">
                            <div id="method-info" class="method-info"></div>
                            <div id="method-calls" class="method-calls">
                                <h5>调用关系</h5>
                                <div id="calls-list"></div>
                            </div>
                            <div id="method-called-by" class="method-called-by">
                                <h5>被调用关系</h5>
                                <div id="called-by-list"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 场景分析标签页内容已移除 -->
            </div>
        </section>

        <!-- Code Smells Section -->
        <section class="issues-section">
            <h2><i class="fas fa-exclamation-triangle"></i> 代码问题分析</h2>
            <div class="issues-tabs">
                <button class="issues-tab-btn active" data-issues="critical">
                    <i class="fas fa-fire"></i> 严重问题
                </button>
                <button class="issues-tab-btn" data-issues="high">
                    <i class="fas fa-exclamation-circle"></i> 高优先级
                </button>
                <button class="issues-tab-btn" data-issues="medium">
                    <i class="fas fa-info-circle"></i> 中等优先级
                </button>
                <button class="issues-tab-btn" data-issues="all">
                    <i class="fas fa-list"></i> 全部问题
                </button>
            </div>
            <div class="issues-content" id="issues-content">
                <!-- 动态生成问题列表 -->
            </div>
        </section>

        <!-- POJO分析部分已移除 -->

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>由 Nekoama 代码分析工具生成</p>
                <div class="footer-actions">
                    <button id="print-btn" class="btn btn-text">
                        <i class="fas fa-print"></i> 打印报告
                    </button>
                    <button id="fullscreen-btn" class="btn btn-text">
                        <i class="fas fa-expand"></i> 全屏查看
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Hidden Data Container -->
    <script type="application/json" id="analysis-data">
        __DATA_PLACEHOLDER__
    </script>

    <!-- Custom JavaScript -->
    <script src="static/js/g6-visualizer.js"></script>
</body>
</html>
