<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".4"/>
        </filter>
    </defs>

    <!-- Background rounded square (dark theme) -->
    <rect x="4" y="4" width="56" height="56" rx="12" fill="#2B2B2B"/>

    <!-- Dark circle background behind cat -->
    <circle cx="32" cy="32" r="24" fill="#3C3C3C" filter="url(#shadow)"/>

    <!-- Left ear (lighter for dark theme) -->
    <path d="M 19.2 32 L 12.8 15 L 25.6 22.4 Z" fill="#E0E0E0" stroke="#E0E0E0" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Right ear (lighter for dark theme) -->
    <path d="M 44.8 28.8 L 51.2 15 L 38.4 22.4 Z" fill="#E0E0E0" stroke="#E0E0E0" stroke-width="2.88" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Cat head (lighter for dark theme) -->
    <rect x="16" y="19.2" width="32" height="28.8" rx="9.6" fill="#E0E0E0"/>

    <!-- Left eye (dark on light cat) -->
    <circle cx="25.6" cy="32" r="3.2" fill="#2B2B2B"/>
    <!-- Right eye (dark on light cat) -->
    <circle cx="38.4" cy="32" r="3.2" fill="#2B2B2B"/>

    <!-- Tail (lighter for dark theme) -->
    <path d="M 44.8 44.8 Q 54.4 48 54.4 32"
          stroke="#E0E0E0" stroke-width="4.8" fill="none" stroke-linecap="round"/>
</svg>
