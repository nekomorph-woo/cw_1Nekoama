    <!-- Left ear -->
    <path d="M 6 10 L 4 5 L 8 7 Z" fill="#000000" stroke="#000000" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Right ear -->
    <path d="M 14 9 L 16 5 L 12 7 Z" fill="#000000" stroke="#000000" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>


    <rect x="5" y="6" width="10" height="9" rx="3" fill="#000000"/>

    <circle cx="8" cy="10" r="1" fill="#FFFFFF"/>
    <!-- Right eye - large -->
