<svg  width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
    <defs>
        <!-- 定义猫咪的路径 -->
        <path id="cat-shape" d="M 18 20
             Q 22 24 28 23
             T 36 23
             Q 42 24 46 20
             Q 52 30 50 38
             Q 48 48 32 48
             Q 16 48 14 38
             Q 12 30 18 20 Z"
              fill="#262626"/>
        <path id="tail-shape" d="M 46 44
             Q 58 46 58 34
             Q 58 28 54 28
             Q 52 28 52 30
             Q 54 32 54 35
             Q 54 41 48 40 Z"
              fill="#262626"/>
    </defs>

    <!-- 第一层：白色描边（背景衬托） -->
    <use href="#cat-shape" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <use href="#tail-shape" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

    <!-- 光环背景白边：居中对齐 x=32 -->
    <ellipse cx="32" cy="10" rx="14" ry="4" stroke="#FFFFFF" stroke-width="6" fill="none"/>

    <!-- 第二层：黑色主体 -->
    <use href="#cat-shape" fill="#262626"/>
    <use href="#tail-shape" fill="#262626"/>

    <!-- 光环主体黑线：居中对齐 x=32 -->
    <!-- 稍微加粗一点 stroke-width="2.5" 让它更明显 -->
    <ellipse cx="32" cy="10" rx="14" ry="4" stroke="#262626" stroke-width="2.5" fill="none"/>

    <!-- 眼睛 -->
    <ellipse cx="24" cy="34" rx="3" ry="3.5" fill="#FFFFFF"/>
    <ellipse cx="40" cy="34" rx="3" ry="3.5" fill="#FFFFFF"/>

    <!-- 胡须 -->
    <path d="M 14 37 L 19 38 M 15 41 L 19 41" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 50 37 L 45 38 M 49 41 L 45 41" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"  opacity="0.9"/>

    <!-- 左耳缺口 -->
    <circle cx="16" cy="23" r="1.4" fill="#FFFFFF"/>
</svg>