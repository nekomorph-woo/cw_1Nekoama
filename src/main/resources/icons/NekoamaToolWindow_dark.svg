<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- 暖橘色/陶土色背景 -->
    <rect width="64" height="64" rx="12" fill="#D97559"/>

    <!-- 几何元素：白色色块 -->
    <rect x="20" y="28" width="24" height="20" fill="#FFFFFF"/> <!-- 身体是矩形 -->
    <circle cx="32" cy="22" r="8" fill="#FFFFFF"/> <!-- 头是圆 -->

    <!-- 手绘黑线：连接感 -->
    <g stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round">
        <!-- 一条线穿过身体，像电路板或流程图 -->
        <line x1="10" y1="38" x2="20" y2="38"/>
        <line x1="44" y1="38" x2="54" y2="38"/>
        <!-- 尾巴像个开关 -->
        <path d="M54 38 Q 58 38 58 32"/>
        <circle cx="58" cy="30" r="2" fill="#1A1A1A" stroke="none"/>
    </g>

    <!-- 光环变成了悬浮的线条 -->
    <path d="M26 10 L 38 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>